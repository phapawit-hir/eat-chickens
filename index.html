<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eat Chicken - อร่อยทุกคำ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #ff9a56, #ff6b6b);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        h1 {
            color: #e74c3c;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2rem;
        }
        
        .menu-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #e74c3c;
            transition: transform 0.3s ease;
        }
        
        .menu-item:hover {
            transform: translateX(10px);
        }
        
        .emoji {
            font-size: 2rem;
            margin-right: 1rem;
        }
        
        .item-name {
            font-weight: bold;
            color: #e74c3c;
            margin-right: 1rem;
        }
        
        .item-price {
            color: #27ae60;
            font-weight: bold;
            margin-left: auto;
        }
        
        .cta-button {
            display: block;
            width: 200px;
            margin: 2rem auto;
            padding: 1rem 2rem;
            background: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .cta-button:hover {
            background: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍗 EAT CHICKEN 🍗</h1>
            <p class="subtitle">อร่อยจนต้องกิน ทุกวัน ทุกเวลา</p>
        </header>
        
        <div class="menu-section">
            <h2 style="color: #e74c3c; margin-bottom: 1rem; text-align: center;">เมนูแนะนำ</h2>
            
            <div class="menu-item">
                <span class="emoji">🍗</span>
                <span class="item-name">ไก่ทอดกรอบ</span>
                <span>หนังกรอบ เนื้อนุ่ม รสชาติเข้มข้น</span>
                <span class="item-price">120 ฿</span>
            </div>
            
            <div class="menu-item">
                <span class="emoji">🍖</span>
                <span class="item-name">ไก่ย่างน้ำผึ้ง</span>
                <span>หอมหวาน ย่างสุกกำลังดี</span>
                <span class="item-price">150 ฿</span>
            </div>
            
            <div class="menu-item">
                <span class="emoji">🌶️</span>
                <span class="item-name">ไก่แซ่บ</span>
                <span>เผ็ดร้อน จี้ลิ้น รสจัดจ้าน</span>
                <span class="item-price">130 ฿</span>
            </div>
            
            <div class="menu-item">
                <span class="emoji">🍜</span>
                <span class="item-name">ต้มข่าไก่</span>
                <span>หอมกะทิ เครื่องแกงแกล้ม</span>
                <span class="item-price">90 ฿</span>
            </div>
        </div>
        
        <a href="#" class="cta-button" onclick="alert('อร่อยแน่นอน! 🍗')">สั่งเลย!</a>
    </div>
</body>
</html>
